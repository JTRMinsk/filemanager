[project]
name = "filemanager"
version = "0.3.0"
description = "图形化文件管理：扫描、筛选、排序、批量操作与目录用途推测"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "send2trash>=1.8.0",
]

[project.optional-dependencies]
pack = ["pyinstaller>=6.0,<8"]
[project.scripts]
filemanager = "filemanager.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
